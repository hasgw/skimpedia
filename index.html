    }

    function applySelectionHighlight() {
      const container = document.getElementById('articleBody');
      if (!container) return;
      const sel = window.getSelection();
      if (!sel || sel.isCollapsed || sel.rangeCount === 0) return;

      const range = sel.getRangeAt(0);
      if (!container.contains(range.commonAncestorContainer)) return;

      const selectedText = sel.toString().trim();
      if (!selectedText) return;

      try {
        const mark = document.createElement('mark');
        mark.className = `user-mark ${state.activeMarkerColor}`;
        mark.title = 'クリックするとこのマーカーを消せます';
        mark.onclick = function (e) {
          e.stopPropagation();
          playTap();
          const parent = mark.parentNode;
          while (mark.firstChild) {
            parent.insertBefore(mark.firstChild, mark);
          }
          parent.removeChild(mark);
        };
        range.surroundContents(mark);
        sel.removeAllRanges();
        playTap();
      } catch {
        // Ignore cross-node complex selection errors safely
      }
    }

    function clearAllMarkers() {
      playTap();
      const container = document.getElementById('articleBody');
      if (!container) return;
      const marks = container.querySelectorAll('mark.user-mark');
      marks.forEach(mark => {
        const parent = mark.parentNode;
        while (mark.firstChild) {
          parent.insertBefore(mark.firstChild, mark);
        }
        parent.removeChild(mark);
      });
    }

    function startQuizPhase() {
      playQuizStartChime();
      const modeCfg = MODES[state.modeId];
      const build = () => buildQuestionsFromArticle(state.article, modeCfg.questionCount);
      const seedStr = state.modeId === 'daily' ? (state.dailyKey || getTodayKey()) : state.seed;
      state.questions = seedStr ? withSeed(seedStr, build) : build();
      if (state.questions.length === 0) {
        state.article = pickFallbackArticle(state.article && state.article.title);
        state.questions = build();
      }
      state.qIndex = 0;
      state.draftAnswer = '';
      state.eliminatedChoices = [];
      state.hintUsedForCurrent = false;
      state.confident = false;
      state.answers = [];
      state.score = 0;
      state.memoOpen = false;
      state.screen = 'quiz';
      render();
    }

    // ヒント：自由記述なら答えの頭文字、4択なら選択肢を2つ消す。どちらも、その問題の配点が半分（50pt）になる
    function useHint() {
      const q = state.questions[state.qIndex];
      if (!q || state.hintUsedForCurrent || state.confident) return;
      if (q.type === 'choice') {
        const wrong = q.options.filter(opt => opt !== q.answer && !state.eliminatedChoices.includes(opt));
        state.eliminatedChoices = [...new Set([...state.eliminatedChoices, ...shuffle(wrong).slice(0, 2)])];
      }
      state.hintUsedForCurrent = true;
      playTap();
      render(); // 入力中の文字は state.draftAnswer から復元される
    }

    function submitAnswer(raw) {
      const q = state.questions[state.qIndex];
      if (!q) return false;
      const text = String(raw == null ? '' : raw).trim();
      if (!text) return false;
      playWoodBlock();

      const isCorrect = checkAnswer(q, text);
      const confident = state.confident && !state.hintUsedForCurrent;
      const pts = calcPoints(isCorrect, confident, state.hintUsedForCurrent);
      state.score = Math.max(0, state.score + pts); // 合計は0未満にならない
      state.answers.push({
        question: q,
        chosen: text,
        isCorrect,
        isSkipped: false,
        pointsEarned: pts,
        confident
      });

      advanceOrFinish();
      return true;
    }

    function submitAnswerFromInput() {
      const input = document.getElementById('answerInput');
      const text = input ? input.value : state.draftAnswer;
      if (!String(text).trim()) {
        const note = document.getElementById('answerNote');
        if (note) note.textContent = '答えを入力してください（わからない時は「スキップ」）';
        if (input) input.focus();
        return;
      }
      submitAnswer(text);
    }

    function onAnswerInput(el) {
      state.draftAnswer = el.value;
      const note = document.getElementById('answerNote');
      if (note) note.textContent = '';
    }

    // Enterで回答。日本語入力の変換を確定するEnterでは回答しない
    function onAnswerKeyDown(e) {
      if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) {
        e.preventDefault();
        submitAnswerFromInput();
      }
    }

    function skipCurrentQuestion() {
      const q = state.questions[state.qIndex];
      if (!q) return;
      playWoodBlock();

      state.answers.push({
        question: q,
        chosen: null,
        isCorrect: false,
        isSkipped: true,
        pointsEarned: 0,
        confident: false
      });

      advanceOrFinish();
    }

    function advanceOrFinish() {
      if (state.qIndex + 1 < state.questions.length) {
        state.qIndex += 1;
        state.draftAnswer = '';
        state.eliminatedChoices = [];
        state.hintUsedForCurrent = false;
        state.confident = false;
        render(true);
      } else {
        finishGame();
      }
    }

    function finishGame() {
      stopTimer();
      playResultArpeggio();
      state.scores = saveScore(state.score);
      if (state.modeId === 'daily') {
        saveDailyResult(
          state.dailyKey || getTodayKey(),
          state.score,
          state.answers.filter(a => a.isCorrect).length,
          state.questions.length
        );
      }
      state.showArticleReview = false;
      state.screen = 'result';
      render();
    }

    // ==========================================
    // 6. Keyboard Shortcuts
    // ==========================================
    document.addEventListener('keydown', (e) => {
      const active = document.activeElement;
      const typing = !!active && (active.tagName === 'TEXTAREA' || active.tagName === 'INPUT');

      // 入力中の文字（mなど）で音が切り替わらないようにする
      if ((e.key === 'm' || e.key === 'M') && !e.altKey && !e.ctrlKey && !e.metaKey) {
        if (typing) return;
        toggleMute();
        return;
      }

      if (state.screen === 'memorize') {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
          e.preventDefault();
          startQuizPhase();
        }
      } else if (state.screen === 'quiz') {
        const cur = state.questions[state.qIndex];
        // 回答欄に文字を打てるよう、ショートカットは Alt（Macは Option）つきにしている
        if (e.altKey && e.code === 'KeyC') {
          e.preventDefault();
          setConfidence(!state.confident);
        } else if (e.altKey && e.code === 'KeyH') {
          e.preventDefault();
          useHint();
        } else if (cur && cur.type === 'choice' && !typing && /^[1-4]$/.test(e.key)) {
          // 4択の問題は、数字キーで選べる
          const opt = cur.options[Number(e.key) - 1];
          if (opt && !state.eliminatedChoices.includes(opt)) submitAnswer(opt);
        }
      }
    });

    // ==========================================
    // 7. Rendering
    // ==========================================
    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function escapeRegExp(str) {
      return String(str).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    // 同じ文から複数問出ている場合は1つにまとめる
    function buildSourceGroups(questions) {
      const map = new Map();
      (questions || []).forEach((q, i) => {
        if (!q.sourceText) return;
        const key = String(q.sourceText).replace(/\s+/g, ' ').trim();
        if (!key) return;
        if (!map.has(key)) map.set(key, { text: key, nums: [], answers: [] });
        const g = map.get(key);
        g.nums.push(i + 1);
        g.answers.push(q.answer);
      });
      return [...map.values()];
    }

    function renderSourceParagraph(paragraph, groups, foundGroups) {
      const text = String(paragraph || '').replace(/\s+/g, ' ');
      const ranges = [];
      groups.forEach(g => {
        const idx = text.indexOf(g.text);
        if (idx >= 0) ranges.push({ start: idx, end: idx + g.text.length, g });
      });
      ranges.sort((a, b) => a.start - b.start);

      let html = '';
      let cursor = 0;
      ranges.forEach(r => {
        if (r.start < cursor) return; // 重なる場合は後ろを無視
        html += escapeHtml(text.slice(cursor, r.start));

        const raw = text.slice(r.start, r.end);
        const answers = [...new Set(r.g.answers)].filter(Boolean).sort((a, b) => b.length - a.length);
        let inner;
        if (answers.length > 0) {
          const re = new RegExp('(' + answers.map(escapeRegExp).join('|') + ')');
          inner = raw.split(re)
            .map((part, i) => (i % 2 === 1 ? `<strong class="src-answer">${escapeHtml(part)}</strong>` : escapeHtml(part)))
            .join('');
        } else {
          inner = escapeHtml(raw);
        }
        const badges = r.g.nums.map(n => `<span class="src-badge">第${n}問</span>`).join('');
        html += `<mark class="src-mark" data-qs="${r.g.nums.join(' ')}">${inner}</mark>${badges}`;

        foundGroups.add(r.g);
        cursor = r.end;
      });
      html += escapeHtml(text.slice(cursor));
      return html;
    }

    function buildArticleReviewHtml(article, questions) {
      if (!article || !article.sections) return '';
      const groups = buildSourceGroups(questions);
      const found = new Set();

      const body = article.sections.map(sec => `
        <h3>${escapeHtml(sec.heading)}</h3>
        ${(sec.paragraphs || []).map(p => `<p>${renderSourceParagraph(p, groups, found)}</p>`).join('')}
      `).join('');

      const missing = groups.filter(g => !found.has(g));
      const missingHtml = missing.length === 0 ? '' : `
        <div style="margin-top:14px;padding:10px 12px;border-radius:12px;background:#fafafa;border:1px solid #e4e4e4;font-size:12.5px;line-height:1.7;color:#555555;">
          本文中で位置を特定できなかった出題箇所：
          ${missing.map(g => `<div>${g.nums.map(n => `第${n}問`).join('・')}：「${escapeHtml(g.text)}」</div>`).join('')}
        </div>`;

      return `
        <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;">
          <span style="font-size:13px;font-weight:800;color:#141414;">📖 元の記事：${escapeHtml(article.title)}</span>
          <span style="font-size:12px;color:#666666;">
            <mark class="src-mark">黄色</mark>＝出題された文　<span class="src-answer">下線</span>＝正解の語句
          </span>
        </div>
        <article id="articleReviewBody" class="article-body">${body}</article>
        ${missingHtml}
      `;
    }

    function setArticleReviewOpen(open) {
      state.showArticleReview = open;
      const panel = document.getElementById('articleReviewPanel');
      const btn = document.getElementById('articleReviewBtn');
      if (panel) panel.style.display = open ? 'block' : 'none';
      if (btn) btn.textContent = open ? '📖 元の記事を閉じる' : '📖 元の記事と出題箇所を確認する';
    }

    function toggleArticleReview() {
      playTap();
      setArticleReviewOpen(!state.showArticleReview);
    }

    // 問題番号を指定して、記事中の該当箇所までスクロールする
    function openArticleAt(n) {
      playTap();
      setArticleReviewOpen(true);
      const target = document.querySelector(`#articleReviewPanel [data-qs~="${n}"]`);
      if (!target) return;
      target.scrollIntoView({ behavior: 'smooth', block: 'center' });
      target.classList.remove('flash');
      void target.offsetWidth;
      target.classList.add('flash');
    }

    function render(animateQuestionSlide = false) {
      const root = document.getElementById('root');
      if (!root) return;

      if (state.screen === 'start') {
        const lastText = state.scores.last !== null ? `${state.scores.last} pt` : '—';
        const highText = `${state.scores.high || 0} pt`;
        root.innerHTML = `
          <main class="start-screen">
            <div class="bg-shape bg-blob-left"></div>
            <div class="bg-shape bg-ring-top"></div>
            <div class="bg-shape bg-dots-right">
              ${Array.from({ length: 16 }).map(() => '<span></span>').join('')}
            </div>
            <div class="bg-shape bg-blob-bottom-right"></div>

            <div class="start-center">
              <div class="start-eyebrow select-none anim-pop-1">WIKIPEDIA MEMORY QUIZ</div>
              <h1 class="game-logo font-display anim-pop-2">SkimPediA</h1>
              <p class="game-subtitle anim-pop-2">
                未知の記事をパッと読んで記憶し、穴埋めの記述と絶妙に怪しい4択で記憶力を試す<br />
                ミニマル記憶クイズゲーム
              </p>
              <button type="button" class="start-cta-btn anim-pop-3" onclick="goToModeSelect()">
                <span>▶ START</span>
              </button>
              ${buildChallengeBannerHtml()}
            </div>

            <div class="score-card-bottom-left select-none anim-pop-3">
              <div class="score-cell">
                <div class="score-cell-label">前回スコア</div>
                <div class="score-cell-value">${escapeHtml(lastText)}</div>
              </div>
              <div class="score-cell">
                <div class="score-cell-label">ハイスコア</div>
                <div class="score-cell-value">${escapeHtml(highText)}</div>
              </div>
            </div>
          </main>
        `;
        return;
      }

      if (state.screen === 'mode') {
        root.innerHTML = `
          <div class="app-shell anim-screen">
            <div class="main-card">
              <div class="top-bar">
                <div class="top-bar-left">
                  <span class="brand-mini font-display select-none">SkimPediA</span>
                  <span class="pill-badge select-none whitespace-nowrap">モード選択</span>
                </div>
                <div class="top-bar-right">
                  <button type="button" class="btn-ghost-sm select-none whitespace-nowrap" onclick="goToStart()">
                    タイトルへ
                  </button>
                </div>
              </div>

              <div class="guide-banner">
                遊びたいモードを選んでください。記事を読んで要点を覚えたあと、まとめてクイズに挑戦します。
              </div>

              <div class="mode-grid">
                ${Object.values(MODES).map(m => `
                  <button type="button" class="mode-card" onclick="selectMode('${m.id}', false)">
                    <div>
                      <h2 class="font-display" style="margin:0 0 6px;font-size:22px;font-weight:900;color:#141414;">
                        ${escapeHtml(m.name)}
                      </h2>
                      <p style="margin:0;font-size:13.5px;line-height:1.65;color:#555555;">
                        ${escapeHtml(m.desc)}
                      </p>
                      ${m.id === 'daily' ? `<p style="margin:8px 0 0;font-size:12.5px;font-weight:800;color:#141414;">${escapeHtml(dailyStatusText())}</p>` : ''}
                    </div>
                    <div style="margin-top:16px;padding-top:12px;border-top:1px solid #e8e8e8;display:flex;justify-content:space-between;font-size:12.5px;font-weight:800;color:#181818;">
                      <span>全${m.questionCount}問</span>
                      <span>制限時間 ${Math.floor(m.timeLimitSec / 60)}分</span>
                    </div>
                  </button>
                `).join('')}
              </div>
            </div>
          </div>
        `;
        return;
      }

      if (state.screen === 'loading') {
        root.innerHTML = `
          <div class="app-shell anim-screen">
            <div class="main-card" style="text-align:center;padding:64px 24px;">
              <div class="pill-badge select-none" style="margin-bottom:14px;">記事を取得中</div>
              <h2 class="font-display" style="margin:0 0 8px;font-size:24px;font-weight:900;color:#141414;">
                お題の記事を準備しています…
              </h2>
              <p style="margin:0;font-size:14px;color:#666666;">
                少々お待ちください
              </p>
            </div>
          </div>
        `;
        return;
      }

      if (state.screen === 'memorize') {
        const modeCfg = MODES[state.modeId];
        const art = state.article;
        const charCount = countArticleChars(art);
        const readMin = estimateReadMinutes(charCount);
        const hasMemoText = state.memoText.trim().length > 0;

        root.innerHTML = `
          <div class="app-shell anim-screen">
            <div class="main-card">
              <div class="top-bar">
                <div class="top-bar-left">
                  <span class="brand-mini font-display select-none">SkimPediA</span>
                  <span class="pill-badge select-none whitespace-nowrap">${escapeHtml(modeCfg.name)}（全${modeCfg.questionCount}問）</span>
                  <span class="pill-badge dark select-none whitespace-nowrap">暗記フェーズ</span>
                </div>
                <div class="top-bar-right">
                  <span id="timerDisplay" class="timer-pill select-none whitespace-nowrap ${state.timeLeftSec <= 60 ? 'warning' : ''}">
                    ${formatTime(state.timeLeftSec)}
                  </span>
                  <button type="button" class="btn-ghost-sm select-none whitespace-nowrap" onclick="goToModeSelect()">
                    モード変更
                  </button>
                  <button type="button" class="btn-ghost-sm select-none whitespace-nowrap" onclick="goToStart()">
                    タイトルへ
                  </button>
                </div>
              </div>

              <div class="guide-banner">
                ${modeCfg.flow
                  ? '記事は時間とともに上から消えていきます。消える前に読み切って、重要な数字・名称・出来事を覚えましょう（マーカーは使えません）。'
                  : '記事を読んで重要な数字・名称・出来事を覚えましょう。気になる箇所はドラッグ選択してマーカーを引けます。'}
              </div>

              <div class="article-head">
                <div>
                  <div style="display:flex;flex-wrap:wrap;gap:6px;">
                    <span class="pill-badge select-none whitespace-nowrap">ジャンル：${escapeHtml(art.genre)}</span>
                    <span class="pill-badge select-none whitespace-nowrap">難易度：${escapeHtml(art.difficulty)}</span>
                  </div>
                  <h1 class="article-title font-display">${escapeHtml(art.title)}</h1>
                  <div class="article-meta">
                    約 ${charCount} 文字（読む目安：約 ${readMin} 分） ・ 出典：ウィキペディア（Wikipedia）
                  </div>
                </div>

                <div class="article-actions">
                  ${state.modeId === 'daily' || state.activeChallenge ? '' : `<button
                    type="button"
                    class="btn-secondary select-none whitespace-nowrap"
                    style="padding:8px 14px;font-size:13px;"
                    ${state.rerollUsed ? 'disabled' : ''}
                    onclick="selectMode('${state.modeId}', true)"
                  >
                    ${state.rerollUsed ? '引き直し済み' : '🔄 別の記事にする（1回）'}
                  </button>`}
                </div>
              </div>

              <div class="marker-bar select-none">
                ${modeCfg.flow ? `                <div class="marker-controls">
                  <span class="marker-label whitespace-nowrap">記事の残り：</span>
                  <div class="flow-bar"><i id="flowBarFill"></i></div>
                  <span id="flowLabel" class="marker-label whitespace-nowrap">100%</span>
                </div>
` : `                <div class="marker-controls">
                  <span class="marker-label whitespace-nowrap">マーカー：</span>
                  <button
                    type="button"
                    class="marker-btn whitespace-nowrap ${state.activeMarkerColor === 'yellow' ? 'active-yellow' : ''}"
                    onclick="setMarkerColor('yellow')"
                  >
                    <span class="marker-dot yellow"></span>
                    <span>黄</span>
                  </button>
                  <button
                    type="button"
                    class="marker-btn whitespace-nowrap ${state.activeMarkerColor === 'pink' ? 'active-pink' : ''}"
                    onclick="setMarkerColor('pink')"
                  >
                    <span class="marker-dot pink"></span>
                    <span>ピンク</span>
                  </button>
                  <button
                    type="button"
                    class="marker-btn whitespace-nowrap"
                    onclick="clearAllMarkers()"
                  >
                    <span>消去</span>
                  </button>
                  <button
                    type="button"
                    class="btn-ghost-sm whitespace-nowrap"
                    onclick="applySelectionHighlight()"
                  >
                    選択範囲に線を引く
                  </button>
                </div>
`}
                <div class="marker-right-tools">
                  ${modeCfg.flow ? '' : '<span class="marker-hint-text whitespace-nowrap">文字をドラッグ選択して押すと線を引けます</span>'}
                  <button
                    type="button"
                    class="memo-toggle-btn whitespace-nowrap ${state.memoOpen ? 'is-open' : ''}"
                    onclick="toggleMemoDrawer()"
                  >
                    <span>📝 メモ</span>
                    ${hasMemoText ? '<span class="memo-has-dot" title="メモ入力あり"></span>' : ''}
                  </button>
                </div>
              </div>

              ${state.memoOpen ? `
                <div class="memo-drawer">
                  <div class="memo-drawer-head">
                    <span style="font-size:13px;font-weight:800;color:#141414;">暗記用メモ帳（クイズ中は非表示・結果画面で確認可能）</span>
                    <button type="button" class="btn-ghost-sm whitespace-nowrap" onclick="state.memoText=''; render();">
                      クリア
                    </button>
                  </div>
                  <textarea
                    class="memo-textarea"
                    placeholder="年号・人名・キーワードなどを自由にメモできます…"
                    oninput="state.memoText = this.value"
                  >${escapeHtml(state.memoText)}</textarea>
                </div>
              ` : ''}

              <article id="articleBody" class="article-body" ${modeCfg.flow ? '' : 'onmouseup="applySelectionHighlight()"'}>
                ${modeCfg.flow ? buildFlowArticleHtml(art) : art.sections.map(sec => `
                  <h3>${escapeHtml(sec.heading)}</h3>
                  ${(sec.paragraphs || []).map(p => `<p>${escapeHtml(p)}</p>`).join('')}
                `).join('')}
              </article>

              <div class="bottom-action-bar">
                <span style="font-size:12.5px;color:#666666;">
                  ショートカット：<code>Ctrl + Enter</code>（Macは <code>Cmd + Enter</code>）でクイズ開始
                </span>
                <button type="button" class="btn-primary whitespace-nowrap" onclick="startQuizPhase()">
                  暗記完了！クイズへ進む
                </button>
              </div>
            </div>
          </div>
        `;
        if (modeCfg.flow) startFlowTicker();
        return;
      }

      if (state.screen === 'quiz') {
        const modeCfg = MODES[state.modeId];
        const q = state.questions[state.qIndex];
        const total = state.questions.length;

        root.innerHTML = `
          <div class="app-shell anim-screen">
            <div class="main-card">
              <div class="top-bar">
                <div class="top-bar-left">
                  <span class="brand-mini font-display select-none">SkimPediA</span>
                  <span class="pill-badge select-none whitespace-nowrap">${escapeHtml(modeCfg.name)}</span>
                  <span class="pill-badge dark select-none whitespace-nowrap">第 ${state.qIndex + 1} / ${total} 問</span>
                </div>
                <div class="top-bar-right">
                  <span id="timerDisplay" class="timer-pill select-none whitespace-nowrap ${state.timeLeftSec <= 60 ? 'warning' : ''}">
                    ${formatTime(state.timeLeftSec)}
                  </span>
                  <button type="button" class="btn-ghost-sm select-none whitespace-nowrap" onclick="goToStart()">
                    タイトルへ
                  </button>
                </div>
              </div>

              <div class="${animateQuestionSlide ? 'anim-question' : 'anim-screen'}" style="margin-top:20px;">
                <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;">
                  <span id="pointsPill" class="pill-badge select-none whitespace-nowrap">${escapeHtml(pointsPillText())}</span>
                  <div style="display:flex;gap:8px;">
                    <button
                      type="button"
                      id="hintBtn"
                      class="btn-ghost-sm select-none whitespace-nowrap"
                      ${state.hintUsedForCurrent || state.confident ? 'disabled' : ''}
                      onclick="useHint()"
                    >
                      ${q.type === 'choice' ? '💡 50:50（2択に絞る・半分の点）' : '💡 頭文字ヒント（半分の点）'}
                    </button>
                    <button
                      type="button"
                      class="btn-ghost-sm select-none whitespace-nowrap"
                      onclick="skipCurrentQuestion()"
                    >
                      スキップ
                    </button>
                  </div>
                </div>

                ${buildBetRowHtml()}

                <h2 class="font-display" style="margin:16px 0 20px;font-size:clamp(19px,2.4vw,25px);font-weight:900;line-height:1.5;color:#141414;white-space:pre-line;">
                  ${escapeHtml(q.prompt)}
                </h2>

                ${q.type === 'choice' ? `
                <div class="answer-hint select-none">
                  <span>💡 ヒント：</span><strong>4択（正しいものを1つ選んでください）</strong>
                </div>

                <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;">
                  ${q.options.map((opt, idx) => {
                    const isElim = state.eliminatedChoices.includes(opt);
                    return `
                      <button
                        type="button"
                        class="choice-btn"
                        ${isElim ? 'disabled' : ''}
                        onclick="submitAnswer(${JSON.stringify(opt).replace(/"/g, '&quot;')})"
                      >
                        <span class="choice-key select-none">${idx + 1}</span>
                        <span>${escapeHtml(opt)}</span>
                      </button>
                    `;
                  }).join('')}
                </div>

                <div class="kbd-hint" style="margin-top:18px;font-size:12px;color:#777777;">
                  <code>1</code>〜<code>4</code> で回答、<code>Alt</code>（Macは <code>Option</code>）＋ <code>C</code> で自信度の切替、<code>H</code> で50:50（結果は最後にまとめて採点されます）
                </div>
                ` : `
                <div class="answer-hint select-none">
                  <span>💡 ヒント：</span><strong>${escapeHtml(q.shape)}</strong>
                  ${state.hintUsedForCurrent ? `<span>／ 頭文字：</span><strong>${escapeHtml(q.firstChar)}</strong>` : ''}
                </div>

                <div class="answer-row">
                  <input
                    id="answerInput"
                    class="answer-input"
                    type="text"
                    inputmode="text"
                    autocomplete="off"
                    autocapitalize="off"
                    autocorrect="off"
                    spellcheck="false"
                    enterkeyhint="done"
                    placeholder="ここに答えを入力"
                    aria-label="答え"
                    value="${escapeHtml(state.draftAnswer)}"
                    oninput="onAnswerInput(this)"
                    onkeydown="onAnswerKeyDown(event)"
                  />
                  <button type="button" class="btn-primary whitespace-nowrap" onclick="submitAnswerFromInput()">回答する</button>
                </div>
                <div id="answerNote" class="answer-note"></div>

                <div class="kbd-hint" style="margin-top:18px;font-size:12px;color:#777777;">
                  <code>Enter</code> で回答、<code>Alt</code>（Macは <code>Option</code>）＋ <code>C</code> で自信度の切替、<code>H</code> で頭文字ヒント（結果は最後にまとめて採点されます）
                </div>
                `}
              </div>
            </div>
          </div>
        `;
        const answerInput = document.getElementById('answerInput');
        if (answerInput) {
          answerInput.focus({ preventScroll: true });
          const end = answerInput.value.length;
          answerInput.setSelectionRange(end, end);
        }
        return;
      }

      if (state.screen === 'result') {
        const modeCfg = MODES[state.modeId];
        const correctCount = state.answers.filter(a => a.isCorrect).length;
        const totalCount = state.answers.length;
        const rate = totalCount > 0 ? Math.round((correctCount / totalCount) * 100) : 0;

        root.innerHTML = `
          <div class="app-shell anim-screen">
            <div class="main-card">
              <div class="top-bar">
                <div class="top-bar-left">
                  <span class="brand-mini font-display select-none">SkimPediA</span>
                  <span class="pill-badge select-none whitespace-nowrap">${escapeHtml(modeCfg.name)}</span>
                  <span class="pill-badge dark select-none whitespace-nowrap">最終採点結果</span>
                </div>
                <div class="top-bar-right">
                  <button type="button" class="btn-ghost-sm select-none whitespace-nowrap" onclick="goToStart()">
                    タイトルへ
                  </button>
                </div>
              </div>

              ${buildVersusBannerHtml()}

              <div class="result-summary-grid">
                <div class="stat-box">
                  <div class="stat-box-label">獲得スコア</div>
                  <div class="stat-box-value">${state.score} pt</div>
                </div>
                <div class="stat-box">
                  <div class="stat-box-label">正解数</div>
                  <div class="stat-box-value">${correctCount} / ${totalCount} 問</div>
                </div>
                <div class="stat-box">
                  <div class="stat-box-label">正答率</div>
                  <div class="stat-box-value">${rate}%</div>
                </div>
                <div class="stat-box">
                  <div class="stat-box-label">ハイスコア</div>
                  <div class="stat-box-value">${state.scores.high || 0} pt</div>
                </div>
              </div>

              ${state.modeId !== 'tutorial' ? buildShareCardHtml() : ''}

              <div style="margin-top:16px;display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;">
                <a
                  class="btn-secondary whitespace-nowrap"
                  style="padding:9px 16px;font-size:13px;text-decoration:none;display:inline-flex;align-items:center;"
                  href="${escapeHtml(getWikipediaUrl(state.article))}"
                  target="_blank"
                  rel="noopener noreferrer"
                >🌐 Wikipediaで全文を読む ↗</a>
                <button
                  type="button"
                  id="articleReviewBtn"
                  class="btn-secondary whitespace-nowrap"
                  style="padding:9px 16px;font-size:13px;"
                  onclick="toggleArticleReview()"
                >${state.showArticleReview ? '📖 元の記事を閉じる' : '📖 元の記事と出題箇所を確認する'}</button>
              </div>

              <div id="articleReviewPanel" class="article-review-panel" style="display:${state.showArticleReview ? 'block' : 'none'};">
                ${buildArticleReviewHtml(state.article, state.answers.map(a => a.question))}
              </div>

              ${state.memoText.trim() ? `
                <div style="margin-top:16px;padding:14px 16px;border-radius:16px;background:#fafafa;border:1px solid #e4e4e4;">
                  <div style="font-size:12.5px;font-weight:800;color:#141414;margin-bottom:6px;">📝 暗記中に書いたメモ</div>
                  <div style="font-size:13.5px;line-height:1.65;white-space:pre-wrap;color:#333333;">${escapeHtml(state.memoText)}</div>
                </div>
              ` : ''}

              <div style="margin-top:22px;display:flex;flex-direction:column;gap:12px;">
                ${state.answers.map((item, idx) => {
                  const statusText = item.isSkipped
                    ? 'スキップ'
                    : `${item.confident ? '🔥 ' : ''}${item.isCorrect ? '正解' : '不正解'} (${formatPoints(item.pointsEarned)} pt)`;
                  return `
                    <div class="review-item" style="animation: fadeSlideUp 0.35s var(--ease-spring) ${Math.min(idx * 0.05, 0.4)}s both;">
                      <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;">
                        <span style="font-size:12.5px;font-weight:800;color:#555555;">第 ${idx + 1} 問</span>
                        <span class="pill-badge ${item.isCorrect ? 'dark' : ''} select-none whitespace-nowrap">${escapeHtml(statusText)}</span>
                      </div>
                      <div style="margin-top:8px;font-size:15px;font-weight:800;color:#141414;white-space:pre-line;">
                        ${escapeHtml(item.question.prompt)}
                      </div>
                      <div style="margin-top:8px;font-size:13.5px;line-height:1.6;color:#333333;">
                        <div>あなたの回答：<strong>${item.isSkipped ? '（スキップ）' : escapeHtml(item.chosen)}</strong></div>
                        <div>正解：<strong>${escapeHtml(item.question.answer)}</strong></div>
                        ${item.question.sourceText ? `<div style="margin-top:4px;font-size:12.5px;color:#666666;">記事の該当箇所：「${escapeHtml(item.question.sourceText)}」</div>` : ''}
                      </div>
                      ${item.question.sourceText ? `
                        <div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:8px;">
                          <button type="button" class="btn-ghost-sm select-none whitespace-nowrap" onclick="openArticleAt(${idx + 1})">
                            📍 記事の該当箇所を見る
                          </button>
                          ${item.isCorrect ? '' : `<a class="btn-ghost-sm select-none whitespace-nowrap" style="text-decoration:none;display:inline-flex;align-items:center;" href="${escapeHtml(getWikipediaUrl(state.article))}" target="_blank" rel="noopener noreferrer">📚 Wikipediaで復習 ↗</a>`}
                        </div>` : ''}
                    </div>
                  `;
                }).join('')}
              </div>

              <div class="bottom-action-bar">
                <button type="button" class="btn-secondary whitespace-nowrap" onclick="goToModeSelect()">
                  別のモードを選ぶ
                </button>
                <button type="button" class="btn-primary whitespace-nowrap" onclick="selectMode('${state.modeId}', false)">
                  もう一度同じモードで遊ぶ
                </button>
              </div>
            </div>
          </div>
        `;
        if (state.modeId !== 'tutorial') updateSharePreview();
      }
    }

    // Initial Render
    function mountAudioButton() {
      const btn = document.createElement('button');
      btn.id = 'audioToggleBtn';
      btn.type = 'button';
      btn.className = 'top-audio-btn select-none whitespace-nowrap';
      btn.onclick = toggleMute;
      btn.innerHTML = `<span id="audioIcon">${isMuted ? '🔇' : '🔊'}</span> <span id="audioLabel">${isMuted ? '音: OFF' : '音: ON'}</span>`;
      document.body.insertBefore(btn, document.body.firstChild);
    }
    mountAudioButton();
    state.challenge = parseChallengeFromHash();
    // 開いたままの別タブでリンクを開き直した時にも、挑戦状を受け取る
    window.addEventListener('hashchange', () => {
      const c = parseChallengeFromHash();
      if (!c) return;
      state.challenge = c;
      state.challengeError = false;
      if (state.screen === 'start') render();
      else goToStart();
    });
    render();
  </script>
</body>
</html>
