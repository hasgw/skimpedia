<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkimPediA</title>
  <meta name="description" content="未知の記事をパッと読んで記憶し、穴埋めの記述と絶妙に怪しい4択で記憶力を試すミニマル記憶クイズゲーム" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="SkimPediA" />
  <meta property="og:title" content="SkimPediA" />
  <meta property="og:description" content="未知の記事をパッと読んで記憶し、穴埋めの記述と絶妙に怪しい4択で記憶力を試すミニマル記憶クイズゲーム" />
  <meta property="og:locale" content="ja_JP" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="SkimPediA" />
  <meta name="twitter:description" content="未知の記事をパッと読んで記憶し、穴埋めの記述と絶妙に怪しい4択で記憶力を試すミニマル記憶クイズゲーム" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-canvas: #f5f5f5;
      --bg-surface: #ffffff;
      --bg-soft: #efefef;
      --ink-strong: #141414;
      --ink-main: #222222;
      --ink-muted: #666666;
      --ink-faint: #8c8c8c;
      --line-soft: #e2e2e2;
      --line-strong: #181818;
      --mark-yellow: rgba(250, 224, 96, 0.72);
      --mark-pink: rgba(249, 168, 212, 0.65);
      --radius-xl: 28px;
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-pill: 999px;
      --shadow-card: 0 18px 44px rgba(0, 0, 0, 0.06);
      --shadow-pop: 0 10px 24px rgba(0, 0, 0, 0.12);
      --ease-spring: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background-color: var(--bg-canvas);
      color: var(--ink-main);
      font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: clip;
    }

    .font-display {
      font-family: 'M PLUS Rounded 1c', 'Noto Sans JP', sans-serif;
    }

    .select-none {
      user-select: none;
      -webkit-user-select: none;
    }

    .whitespace-nowrap {
      white-space: nowrap;
    }

    /* Animations */
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(1.5deg); }
    }

    @keyframes floatReverse {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(8px) scale(1.03); }
    }

    @keyframes popIn {
      0% { opacity: 0; transform: translateY(16px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes fadeSlideUp {
      0% { opacity: 0; transform: translateY(12px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideFromRight {
      0% { opacity: 0; transform: translateX(24px); }
      100% { opacity: 1; transform: translateX(0); }
    }

    .anim-pop-1 { animation: popIn 0.55s var(--ease-spring) both; }
    .anim-pop-2 { animation: popIn 0.65s var(--ease-spring) 0.08s both; }
    .anim-pop-3 { animation: popIn 0.7s var(--ease-spring) 0.15s both; }
    .anim-screen { animation: fadeSlideUp 0.4s var(--ease-spring) both; }
    .anim-question { animation: slideFromRight 0.34s var(--ease-spring) both; }

    /* Top Mute Button */
    .top-audio-btn {
      position: fixed;
      top: 14px;
      right: 16px;
      z-index: 60;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: var(--radius-pill);
      border: 1.5px solid #d4d4d4;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      color: var(--ink-strong);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
      transition: transform 0.18s var(--ease-spring), background-color 0.18s ease, border-color 0.18s ease;
    }

    .top-audio-btn:hover {
      transform: translateY(-1px);
      background: #ffffff;
      border-color: var(--ink-strong);
    }

    .top-audio-btn:active {
      transform: scale(0.96);
    }

    /* Start Screen */
    .start-screen {
      position: relative;
      min-height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 20px 120px;
      overflow: hidden;
    }

    .bg-shape {
      position: absolute;
      pointer-events: none;
      z-index: 0;
    }

    .bg-blob-left {
      top: -6%;
      left: -8%;
      width: clamp(220px, 34vw, 460px);
      height: clamp(240px, 42vh, 520px);
      background: #e7e7e7;
      border-radius: 38% 62% 54% 46% / 44% 38% 62% 56%;
      animation: floatSlow 9s ease-in-out infinite;
    }

    .bg-ring-top {
      top: 7%;
      right: 14%;
      width: clamp(46px, 6vw, 84px);
      height: clamp(46px, 6vw, 84px);
      border: 9px solid #e4e4e4;
      border-radius: 50%;
      animation: floatReverse 7.5s ease-in-out infinite;
    }

    .bg-dots-right {
      top: 32%;
      right: 4%;
      display: grid;
      grid-template-columns: repeat(4, 8px);
      gap: 10px;
      opacity: 0.7;
      animation: floatSlow 8s ease-in-out infinite;
    }

    .bg-dots-right span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #dcdcdc;
    }

    .bg-blob-bottom-right {
      bottom: -14%;
      right: -6%;
      width: clamp(260px, 38vw, 520px);
      height: clamp(210px, 32vh, 390px);
      background: #e6e6e6;
      border-radius: 62% 38% 42% 58% / 55% 60% 40% 45%;
      animation: floatReverse 10s ease-in-out infinite;
    }

    .start-center {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 680px;
      width: 100%;
    }

    .start-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 14px;
      border-radius: var(--radius-pill);
      background: #ffffff;
      border: 1px solid #e0e0e0;
      color: var(--ink-muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      margin-bottom: 14px;
    }

    .game-logo {
      margin: 0;
      font-size: clamp(50px, 9.5vw, 104px);
      line-height: 1.04;
      font-weight: 900;
      letter-spacing: -0.03em;
      color: var(--ink-strong);
      text-shadow: 0 6px 24px rgba(0, 0, 0, 0.05);
    }

    .game-subtitle {
      margin: 14px 0 34px;
      font-size: clamp(14px, 2vw, 17px);
      font-weight: 600;
      color: var(--ink-muted);
      line-height: 1.65;
    }

    .start-cta-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 46px;
      border-radius: var(--radius-pill);
      border: 2px solid var(--ink-strong);
      background: var(--ink-strong);
      color: #ffffff;
      font-size: clamp(17px, 2.2vw, 21px);
      font-weight: 800;
      letter-spacing: 0.04em;
      cursor: pointer;
      box-shadow: var(--shadow-pop);
      transition: transform 0.2s var(--ease-spring), background-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
    }

    .start-cta-btn:hover {
      transform: translateY(-3px) scale(1.02);
      background: #292929;
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.16);
    }

    .start-cta-btn:active {
      transform: scale(0.97);
    }

    .score-card-bottom-left {
      position: fixed;
      left: 20px;
      bottom: 20px;
      z-index: 20;
      display: grid;
      grid-template-columns: repeat(2, minmax(96px, auto));
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
      border: 1.5px solid #e2e2e2;
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
      overflow: hidden;
    }

    .score-cell {
      padding: 10px 16px;
    }

    .score-cell + .score-cell {
      border-left: 1px solid #ececec;
    }

    .score-cell-label {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: var(--ink-faint);
      margin-bottom: 2px;
    }

    .score-cell-value {
      font-size: 16px;
      font-weight: 900;
      color: var(--ink-strong);
      font-variant-numeric: tabular-nums;
    }

    /* Main Container (Full-width & low wasted margin) */
    .app-shell {
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      padding: 18px clamp(14px, 2.5vw, 32px) 48px;
    }

    .main-card {
      background: var(--bg-surface);
      border: 1.5px solid #e4e4e4;
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-card);
      padding: clamp(18px, 2.6vw, 32px);
    }

    /* Header Bar */
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px 14px;
      padding-bottom: 14px;
      border-bottom: 1px solid #eeeeee;
    }

    .top-bar-left {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .brand-mini {
      font-weight: 900;
      font-size: 14px;
      color: var(--ink-strong);
      letter-spacing: -0.01em;
    }

    .pill-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 11px;
      border-radius: var(--radius-pill);
      font-size: 12px;
      font-weight: 700;
      border: 1px solid #dcdcdc;
      background: #f7f7f7;
      color: var(--ink-main);
    }

    .pill-badge.dark {
      background: var(--ink-strong);
      border-color: var(--ink-strong);
      color: #ffffff;
    }

    .top-bar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    .timer-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: var(--radius-pill);
      border: 1.5px solid #e0e0e0;
      background: #fafafa;
      font-size: 13px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: var(--ink-strong);
    }

    .timer-pill.warning {
      background: var(--ink-strong);
      border-color: var(--ink-strong);
      color: #ffffff;
    }

    .btn-ghost-sm {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      border-radius: var(--radius-md);
      border: 1.5px solid #d8d8d8;
      background: #ffffff;
      color: var(--ink-main);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.15s var(--ease-spring);
    }

    .btn-ghost-sm:hover:not(:disabled) {
      background: #f4f4f4;
      border-color: #bdbdbd;
    }

    .btn-ghost-sm:active:not(:disabled) {
      transform: scale(0.97);
    }

    .btn-ghost-sm:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 22px;
      border-radius: var(--radius-md);
      border: 2px solid var(--ink-strong);
      background: var(--ink-strong);
      color: #ffffff;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.18s var(--ease-spring), background-color 0.18s ease, box-shadow 0.18s ease;
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-1px);
      background: #2a2a2a;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.12);
    }

    .btn-primary:active:not(:disabled) {
      transform: scale(0.98);
    }

    .btn-primary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 10px 18px;
      border-radius: var(--radius-md);
      border: 1.5px solid #cccccc;
      background: #ffffff;
      color: var(--ink-strong);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.18s var(--ease-spring), background-color 0.18s ease, border-color 0.18s ease;
    }

    .btn-secondary:hover:not(:disabled) {
      background: #f5f5f5;
      border-color: var(--ink-strong);
    }

    .btn-secondary:active:not(:disabled) {
      transform: scale(0.98);
    }

    /* Guide Banner */
    .guide-banner {
      margin-top: 12px;
      padding: 11px 16px;
      border-radius: var(--radius-md);
      background: #171717;
      color: #ffffff;
      font-size: 13.5px;
      font-weight: 600;
      line-height: 1.55;
    }

    /* Mode Cards */
    .mode-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
      margin-top: 18px;
    }

    .mode-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-align: left;
      padding: 20px;
      border-radius: var(--radius-lg);
      border: 1.5px solid #e2e2e2;
      background: #fafafa;
      color: var(--ink-main);
      cursor: pointer;
      transition: transform 0.22s var(--ease-spring), border-color 0.2s ease, background-color 0.2s ease, box-shadow 0.22s ease;
    }

    .mode-card:hover {
      transform: translateY(-4px);
      background: #ffffff;
      border-color: var(--ink-strong);
      box-shadow: 0 12px 26px rgba(0, 0, 0, 0.08);
    }

    .mode-card:active {
      transform: scale(0.985);
    }

    /* Article Header & Toolbar */
    .article-head {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-top: 18px;
    }

    .article-title {
      margin: 8px 0 4px;
      font-size: clamp(24px, 3.2vw, 34px);
      font-weight: 900;
      line-height: 1.25;
      color: var(--ink-strong);
      letter-spacing: -0.02em;
    }

    .article-meta {
      font-size: 12.5px;
      color: var(--ink-muted);
      font-weight: 500;
    }

    .article-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    /* Marker Toolbar */
    .marker-bar {
      margin-top: 16px;
      padding: 10px 14px;
      border-radius: 16px;
      background: #f7f7f7;
      border: 1px solid #e5e5e5;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px 14px;
    }

    .marker-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .marker-label {
      font-size: 13px;
      font-weight: 800;
      color: var(--ink-strong);
      margin-right: 2px;
    }

    .marker-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: var(--radius-pill);
      border: 1.5px solid #d4d4d4;
      background: #ffffff;
      color: var(--ink-strong);
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s var(--ease-spring), border-color 0.15s ease, background-color 0.15s ease;
    }

    .marker-btn:hover {
      transform: translateY(-1px);
      border-color: var(--ink-strong);
    }

    .marker-btn.active-yellow {
      background: #fef08a;
      border-color: #181818;
    }

    .marker-btn.active-pink {
      background: #fbcfe8;
      border-color: #181818;
    }

    .marker-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 1px solid rgba(0, 0, 0, 0.28);
      flex-shrink: 0;
    }

    .marker-dot.yellow { background: #facc15; }
    .marker-dot.pink { background: #f472b6; }

    .marker-right-tools {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-left: auto;
    }

    .marker-hint-text {
      font-size: 12px;
      color: var(--ink-muted);
      font-weight: 500;
    }

    .memo-toggle-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 13px;
      border-radius: var(--radius-pill);
      border: 1.5px solid var(--ink-strong);
      background: #ffffff;
      color: var(--ink-strong);
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease, transform 0.15s var(--ease-spring);
    }

    .memo-toggle-btn.is-open,
    .memo-toggle-btn:hover {
      background: var(--ink-strong);
      color: #ffffff;
    }

    .memo-toggle-btn:active {
      transform: scale(0.97);
    }

    .memo-has-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #16a34a;
      display: inline-block;
    }

    /* Collapsible Memo Drawer */
    .memo-drawer {
      margin-top: 12px;
      padding: 14px 16px;
      border-radius: 16px;
      border: 1.5px solid #dcdcdc;
      background: #fafafa;
      animation: fadeSlideUp 0.25s var(--ease-spring) both;
    }

    .memo-drawer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .memo-textarea {
      width: 100%;
      min-height: 92px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1.5px solid #d6d6d6;
      background: #ffffff;
      color: var(--ink-strong);
      font-size: 13.5px;
      line-height: 1.6;
      resize: vertical;
      font-family: inherit;
    }

    .memo-textarea:focus {
      outline: none;
      border-color: var(--ink-strong);
    }

    /* Article Body (Full Width) */
    .article-body {
      margin-top: 18px;
      padding: clamp(18px, 2.5vw, 28px);
      border-radius: 20px;
      border: 1px solid #e7e7e7;
      background: #fcfcfc;
      font-size: clamp(15px, 1.35vw, 17px);
      line-height: 1.92;
      color: var(--ink-main);
    }

    .article-body h3 {
      margin: 22px 0 8px;
      padding-bottom: 5px;
      border-bottom: 1px solid #e5e5e5;
      font-size: clamp(17px, 1.6vw, 20px);
      font-weight: 800;
      color: var(--ink-strong);
    }

    .article-body h3:first-child {
      margin-top: 0;
    }

    .article-body p {
      margin: 0 0 14px;
    }

    .article-body p:last-child {
      margin-bottom: 0;
    }

    mark.user-mark {
      padding: 1px 2px;
      border-radius: 4px;
      color: var(--ink-strong);
      cursor: pointer;
    }

    mark.user-mark.yellow {
      background: var(--mark-yellow);
    }

    mark.user-mark.pink {
      background: var(--mark-pink);
    }

    /* Bottom Action Bar */
    .bottom-action-bar {
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px solid #eeeeee;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    /* Quiz Choices */
    .choice-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
      padding: 14px 18px;
      border-radius: 16px;
      border: 1.5px solid #dddddd;
      background: #ffffff;
      color: var(--ink-strong);
      font-size: 15px;
      font-weight: 700;
      line-height: 1.5;
      cursor: pointer;
      transition: transform 0.16s var(--ease-spring), border-color 0.16s ease, background-color 0.16s ease, box-shadow 0.16s ease;
    }

    .choice-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      border-color: var(--ink-strong);
      background: #fafafa;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.05);
    }

    .choice-btn:active:not(:disabled) {
      transform: scale(0.985);
    }

    .choice-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      text-decoration: line-through;
    }

    .choice-key {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: #f0f0f0;
      border: 1px solid #d8d8d8;
      font-size: 12px;
      font-weight: 900;
      color: var(--ink-strong);
      flex-shrink: 0;
    }

    /* Result Screen */
    .result-summary-grid {
      display: grid;

    // 1. Web Audio API Sound Effects
    // ==========================================
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    let isMuted = false;

    function ensureAudio() {
      if (isMuted) return null;
      if (!audioCtx && AudioCtx) {
        audioCtx = new AudioCtx();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    function playTap() {
      const ctx = ensureAudio();
      if (!ctx) return;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(520, now);
      osc.frequency.exponentialRampToValueAtTime(240, now + 0.045);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.055);
    }

    function playPageFlip() {
      const ctx = ensureAudio();
      if (!ctx) return;
      const now = ctx.currentTime;
      const bufferSize = Math.floor(ctx.sampleRate * 0.07);
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.45));
      }
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;

      const filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(1400, now);
      filter.Q.setValueAtTime(1.2, now);

      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.09, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.075);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      noise.start(now);
    }

    function playWoodBlock() {
      const ctx = ensureAudio();
      if (!ctx) return;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(340, now);
      osc.frequency.exponentialRampToValueAtTime(175, now + 0.07);
      gain.gain.setValueAtTime(0.14, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.085);
    }

      const ctx = ensureAudio();

      const notes = [523.25, 659.25, 783.99];

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.07, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
        osc.connect(gain);

        osc.start(now);

    const STORAGE_KEY = 'sokuseki_pedia_scores_v1';

    function loadScores() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return { last: null, high: 0 };
        const parsed = JSON.parse(raw);
        return {
          last: typeof parsed.last === 'number' ? parsed.last : null,
          high: typeof parsed.high === 'number' ? parsed.high : 0
        };
      } catch {
        return { last: null, high: 0 };
      }
    }

    function saveScore(score) {
      const current = loadScores();
      const updated = {
        last: score,
        high: Math.max(current.high || 0, score)
      };
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(updated));
      } catch {}
      return updated;

      challengeError: false,

      loadToken: 0 // 記事取得中に画面を離れた時の古い結果を捨てるため
    };

    function formatTime(sec) {
      const s = Math.max(0, sec);
      const m = Math.floor(s / 60);
      const r = s % 60;
      return `${String(m).padStart(2, '0')}:${String(r).padStart(2, '0')}`;
    }

    function countArticleChars(article) {
      if (!article || !article.sections) return 0;
      return article.sections.reduce((acc, sec) => {
        const hLen = (sec.heading || '').length;
        const pLen = (sec.paragraphs || []).join('').length;
        return acc + hLen + pLen;
      }, 0);
    }

    function estimateReadMinutes(chars) {
      return Math.max(1, Math.ceil(chars / 350));
    }

    function stopTimer() {
      if (state.timerId) {
        clearInterval(state.timerId);
        state.timerId = null;
      }
    }

    function startTimer() {
      stopTimer();
      state.timerId = setInterval(() => {
        if (state.screen !== 'memorize' && state.screen !== 'quiz') return;
        state.timeLeftSec -= 1;
        if (state.timeLeftSec <= 10 && state.timeLeftSec > 0) {
          playTickWarning();
        }
        if (state.timeLeftSec <= 0) {
          state.timeLeftSec = 0;
          stopTimer();
          finishGame();
          return;
        }
        updateTimerDOM();
      }, 1000);
    }

    function updateTimerDOM() {
      const el = document.getElementById('timerDisplay');
      if (!el) return;
      el.textContent = formatTime(state.timeLeftSec);
      if (state.timeLeftSec <= 60) {
        el.classList.add('warning');
      } else {
        el.classList.remove('warning');
      }
    }

    // ==========================================
    // 4. Wikipedia Fetch & Tricky 4-Choice Generator
    // ==========================================
    // 通常は Math.random。日替わりモードや勝負リンクでは種から作った乱数に差し替え、全員同じ問題にする
    let rng = Math.random;
    function hashSeed(str) {
      let h = 1779033703 ^ String(str).length;
      for (let i = 0; i < str.length; i++) {
        h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
        h = (h << 13) | (h >>> 19);
      }
      h = Math.imul(h ^ (h >>> 16), 2246822507);
      h = Math.imul(h ^ (h >>> 13), 3266489909);
      return (h ^ (h >>> 16)) >>> 0;
    }
    function mulberry32(a) {
      return function () {
        a |= 0; a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    function withSeed(seedStr, fn) {
      const prev = rng;
      rng = mulberry32(hashSeed(seedStr));
      try {
        return fn();
      } finally {
        rng = prev;
      }
    }

    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(rng() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    // ==========================================
    // 4a. 自由記述：答え合わせ・ヒント・問題の作成
    // ==========================================

    // 答えの比較用に表記をそろえる
    //  ・全角/半角、英字の大小、空白、中黒（・）、ハイフン、かぎ括弧は無視
    //  ・ひらがなはカタカナとして扱う（「ちょうちんあんこう」でもOK）
    //  ・単位の表記ゆれ（メートル/m、パーセント/%）、数字のカンマ、先頭の「約」は無視
    function normalizeAnswer(str) {
      let t = String(str || '').normalize('NFKC').toLowerCase();
      t = t.replace(/[\u3041-\u3096]/g, ch => String.fromCharCode(ch.charCodeAt(0) + 0x60));
      t = t.replace(/(\d),(?=\d{3}(\D|$))/g, '$1');
      t = t.replace(/キロメートル/g, 'km').replace(/メートル/g, 'm').replace(/パーセント/g, '%');
      t = t.replace(/[\s・･·\-‐‑–—\u2212「」『』"'“”]/g, '');
      t = t.replace(/^約/, '');
      return t;
    }

    function checkAnswer(q, input) {
      if (q.type === 'choice') return String(input) === q.answer;
      const user = normalizeAnswer(input);
      if (!user) return false;
      return [q.answer, ...(q.accept || [])].some(ans => {
        const norm = normalizeAnswer(ans);
        if (user === norm) return true;
        // 答えが「2006年」のような数字＋単位の時は、数字だけ（2006）でも正解にする
        const m = norm.match(/^(\d+(?:\.\d+)?)\D+$/);
        return !!m && user === m[1];
      });
    }

    function getAnswerCore(answer) {
      return String(answer || '').replace(/[・･\s\u3000]/g, '');
    }

    function getFirstChar(answer) {
      return [...getAnswerCore(answer)][0] || '';
    }

    // 「カタカナで4文字」「漢字で3文字」のような、答えの形のヒント
    function describeAnswerShape(answer) {
      const raw = String(answer || '');
      const hasDot = /[・･]/.test(raw);
      const core = getAnswerCore(raw);
      const len = [...core].length;
      let desc = '';
      const num = core.match(/^[0-9０-９]+(?:[.．][0-9０-９]+)?(\D+)$/);
      if (num) {
        desc = `数字＋「${num[1]}」`;
      } else if (/^[ァ-ヶー]+$/.test(core)) {
        desc = 'カタカナ';
      } else if (/^[一-龠々]+$/.test(core)) {
        desc = '漢字';
      } else if (/^[ぁ-ゖー]+$/.test(core)) {
        desc = 'ひらがな';
      } else if (/^[A-Za-z]+$/.test(core)) {
        desc = 'アルファベット';
      } else {
        const kinds = [];
        if (/[一-龠々]/.test(core)) kinds.push('漢字');
        if (/[ぁ-ゖ]/.test(core)) kinds.push('ひらがな');
        if (/[ァ-ヶ]/.test(core)) kinds.push('カタカナ');
        if (/[0-9０-９]/.test(core)) kinds.push('数字');
        if (/[A-Za-z]/.test(core)) kinds.push('英字');
        desc = kinds.length >= 2 ? `${kinds.join('・')}まじり` : (kinds[0] || '');
      }
      return `${desc}で${len}文字` + (hasDot ? '（「・」は入力不要）' : '');
    }

    function splitIntoSentences(text) {
      return String(text || '')
        .replace(/\s+/g, ' ')
        .split(/(?<=[。．！？!?])/)
        .map(s => s.trim())
        .filter(s => s.length >= 8);
    }

    function wordKind(w) {
      if (/^[0-9０-９]/.test(w)) return 'num';
      if (/^[ァ-ヴー・]+$/.test(w)) return 'kana';
      if (/^[A-Za-z]/.test(w)) return 'latin';
      return 'kanji';
    }

    // 近い数字ほど紛らわしい（難しい）ので、小さな差を先に使う
    function getNumericDeltas() {
      return [...shuffle([-5, -3, -2, -1, 1, 2, 3, 5]), ...shuffle([-10, -7, 7, 10])];
    }

    // 数字＋単位（例：2006年、99.86パーセント、15世紀）から、近い数字の紛らわしい選択肢を作る
    function makeNumericDistractors(ans) {
      const m = ans.match(/^([0-9]+)(?:\.([0-9]+))?(.*)$/);
      if (!m || !m[3]) return null;
      const unit = m[3];
      const list = [];
      const push = (s, c) => {
        if (c <= 0) return;
        if (unit === '月' && c > 12) return;
        if (unit === '日' && c > 31) return;
        if (s !== ans && !list.includes(s)) list.push(s);
      };

      if (m[2] !== undefined) {
        const decimals = m[2].length;
        const base = parseFloat(`${m[1]}.${m[2]}`);
        const step = Math.pow(10, -decimals);
        for (const d of getNumericDeltas()) {
          const c = base + d * step;
          push(c.toFixed(decimals) + unit, c);
          if (list.length >= 3) break;
        }
      } else {
        const num = parseInt(m[1], 10);
        for (const d of getNumericDeltas()) {
          const c = num + d;
          push(`${c}${unit}`, c);
          if (list.length >= 3) break;
        }
      }
      return list.length === 3 ? list : null;
    }

    // 記事が短くて選択肢が足りない時だけ使う、他の記事由来の語句プール
    let genericPoolCache = null;
    function getGenericPool() {
      if (!genericPoolCache) {
        const set = new Set();
        FALLBACK_ARTICLES.forEach(a => {
          const text = a.sections.flatMap(s => s.paragraphs || []).join('');
          splitIntoSentences(text).forEach(sent => {
            extractArticleTargets(sent, a.title).forEach(t => set.add(t));
          });
        });
        genericPoolCache = [...set];
      }
      return genericPoolCache;
    }

    // 4択の選択肢（まちがい3つ）を選ぶ。
    //  ・記事の中の具体的な用語（strongPool）を優先し、一般的な語（weakPool）は足りない時だけ使う
    //  ・同じ種類（漢字／カタカナ…）で、長さが近いものを優先する（紛らわしくする）
    //  ・問題文に出ている語、答えと同じ漢字を含む語（「書物」に対する「書籍」のような同義語）は選ばない
    function pickDistractors(target, maskedSentence, strongPool, weakPool = []) {
      const kind = wordKind(target);
      const usable = t =>
        t !== target &&
        !target.includes(t) &&
        !t.includes(target) &&
        !maskedSentence.includes(t) &&
        !(kind === 'kanji' && [...t].some(ch => /[一-龠々]/.test(ch) && target.includes(ch)));

      const rank = list => {
        const sameKind = shuffle(list.filter(t => wordKind(t) === kind))
          .sort((x, y) => Math.abs(x.length - target.length) - Math.abs(y.length - target.length));
        const otherKind = shuffle(list.filter(t => wordKind(t) !== kind));
        return [...sameKind, ...otherKind];
      };

      const result = [];
      const addFrom = list => {
        for (const t of rank(list.filter(usable))) {
          if (result.length >= 3) break;
          if (!result.includes(t)) result.push(t);
        }
      };
      addFrom(strongPool);
      if (result.length < 3) addFrom(weakPool);
      if (result.length < 3) addFrom(getGenericPool());
      return result.length >= 3 ? result : null;
    }

    function countOccurrences(text, needle) {
      return needle ? String(text).split(needle).length - 1 : 0;
    }

    // 空欄にする語句の候補を集める。
    //  cls  0=数値（細かい数字ほど覚えにくい）／ 1=「」で囲まれた語 ／ 2=その他の語
    //  weak 空欄にしても答えが1つに決まりにくい語（2文字の一般語、「〜的」、他の語にくっついた一部分、
    //       1桁の年月日）。自由記述には向かないので、問題数が足りない時に4択で出題する
    function extractArticleTargetsRanked(sentence, articleTitle) {
      const titleClean = String(articleTitle || '').replace(/（.*?）|\(.*?\)/g, '').trim();
      const ranked = [];
      const seen = new Set();
      const add = (text, weak, cls) => {
        if (!text || seen.has(text) || !sentence.includes(text)) return;
        seen.add(text);
        ranked.push({ text, weak, cls });
      };

      if (titleClean && titleClean.length >= 2) add(titleClean, false, 2);

      // 小数（99.86パーセント など）も1つの数値として拾う
      const numRe = /[0-9０-９]{1,4}(?:[.．][0-9０-９]+)?(?:年|月|日|世紀|代|万人|千人|百人|人|個|種|回|度|メートル|m|km|気圧|パーセント|%)/g;
      const nums = sentence.match(numRe) || [];
      const weakNums = [];
      nums.forEach(n => {
        if (/^[0-9０-９](?:年|月|日)$/.test(n)) weakNums.push(n);
        else add(n, false, 0);
      });

      const quoted = sentence.match(/「([^」]{2,18})」|『([^』]{2,18})』/g) || [];
      quoted.forEach(q => {
        const inner = q.slice(1, -1).trim();
        if (inner.length >= 2) add(inner, false, 1);
      });

      const stopWords = new Set([
        'こと', 'もの', 'ため', 'よう', 'など', 'ほか', 'これら', 'それ', 'これ', 'ところ',
        '現在', '時代', '地域', '中心', '特徴', '代表', '存在', '利用', '影響', '関係',
        '一般', '基本', '主要', '一部', '全体', '結果', '場合', '以降', '以前', '呼ぶ', '呼ば'
      ]);
      // 数値の部分（「15世紀」の「世紀」など）を取り除いてから、単語を探す
      const rest = sentence.replace(numRe, ' ');
      const words = rest.match(/[ァ-ヴー・]{2,14}|[A-Za-z][A-Za-z0-9\-]{1,16}|[一-龠々]{2,10}/g) || [];
      const glued = /[ァ-ヴー一-龠々A-Za-z0-9０-９]/;
      const weakWords = [];
      words.forEach(w => {
        if (stopWords.has(w)) return;
        const len = [...w.replace(/・/g, '')].length;
        const isJa = /^[ァ-ヴー・]+$/.test(w) || /^[一-龠々]+$/.test(w);
        const idx = sentence.indexOf(w);
        const before = idx > 0 ? sentence[idx - 1] : '';
        const after = sentence[idx + w.length] || '';
        if ((isJa && len < 3) || /的$/.test(w) || glued.test(before) || glued.test(after)) weakWords.push(w);
        else add(w, false, 2);
      });
      weakWords.forEach(w => add(w, true, 2));
      weakNums.forEach(n => add(n, true, 0));

      return ranked;
    }

    function extractArticleTargets(sentence, articleTitle) {
      return extractArticleTargetsRanked(sentence, articleTitle).map(r => r.text);
    }

    // 問題を作る。基本は自由記述。自由記述に向かない語句は、問題数が足りない時に4択にして補う。
    //  q.type: 'text'（自由記述）／ 'choice'（4択）
    function buildQuestionsFromArticle(article, count) {
      // 固定問題を持つ記事（チュートリアル用記事）だけが、その問題を使う
      if (article && Array.isArray(article.questions) && article.questions.length > 0) {
        return article.questions.slice(0, count).map(q => {
          if (Array.isArray(q.distractors)) {
            return {
              type: 'choice',
              prompt: q.prompt,
              answer: q.answer,
              options: shuffle([q.answer, ...q.distractors.slice(0, 3)]),
              sourceText: q.sourceText
            };
          }
          return {
            type: 'text',
            prompt: q.prompt,
            answer: q.answer,
            accept: q.accept || [],
            shape: describeAnswerShape(q.answer),
            firstChar: getFirstChar(q.answer),
            sourceText: q.sourceText
          };
        });
      }

      const articleTitleClean = String((article && article.title) || 'お題の記事').replace(/（.*?）|\(.*?\)/g, '').trim();
      const allParagraphs = (article && article.sections ? article.sections : [])
        .flatMap(s => s.paragraphs || []);
      const fullText = allParagraphs.join('');
      const sentences = splitIntoSentences(fullText);

      // 4択の選択肢に使う語。具体的な用語（strong）と、一般的な語（weak）に分けておく
      const allRanked = sentences.flatMap(sent => extractArticleTargetsRanked(sent, articleTitleClean));
      const strongPool = [...new Set(allRanked.filter(r => !r.weak).map(r => r.text))]
        .filter(t => t !== articleTitleClean);
      const weakPool = [...new Set(allRanked.filter(r => r.weak).map(r => r.text))]
        .filter(t => t !== articleTitleClean && !strongPool.includes(t));

      const generated = [];
      const usedTargets = new Set();

      // 周回ごとに、1文あたり最大1問。
      //   0〜2周目：自由記述（答えが決まりやすい語句）
      //   3周目   ：4択（自由記述に向かない語句。問題数の確保用）
      //   4周目   ：残りの語句を自由記述で
      for (let pass = 0; pass < 5 && generated.length < count; pass++) {
        const choicePass = pass === 3;
        for (const sent of shuffle(sentences)) {
          if (generated.length >= count) break;

          // 細かい数字 → 「」の語 → その他の語の順。同じ種類なら、記事中での登場が少ない語（＝細部）を優先する
          const candidates = extractArticleTargetsRanked(sent, articleTitleClean)
            .filter(c =>
              !usedTargets.has(c.text) &&
              c.text.length >= 2 &&
              c.text.length <= 16 &&
              // 記事名そのもの、または記事名の一部は、問題文の見出しで答えが見えてしまう
              c.text !== articleTitleClean &&
              !articleTitleClean.includes(c.text) &&
              (choicePass ? c.weak : !c.weak)
            )
            .sort((a, b) => a.cls - b.cls || countOccurrences(fullText, a.text) - countOccurrences(fullText, b.text));

          for (const c of candidates) {
            const parts = sent.split(c.text);
            if (parts.length !== 2) continue; // 文中に1回だけ出てくる語句だけを空欄にする
            // 「（1868年）」のように答えがかっこの中にある時は、かっこの二重化を避ける
            const maskedSentence = parts.join('（　　　）').replace(/（（　　　））/g, '（　　　）');
            // 空欄以外がほとんど残らない文は、手がかりがなく答えられない
            if (maskedSentence.replace(/[（）　「」『』。、．，\s]/g, '').length < 8) continue;

            if (choicePass) {
              const distractors = makeNumericDistractors(c.text) || pickDistractors(c.text, maskedSentence, strongPool, weakPool);
              if (!distractors) continue;
              usedTargets.add(c.text);
              generated.push({
                type: 'choice',
                prompt: `「${articleTitleClean}」の記事より、次の文の（　　　）に入る正しい語句はどれですか？\n「${maskedSentence}」`,
                answer: c.text,
                options: shuffle([c.text, ...distractors.slice(0, 3)]),
                sourceText: sent
              });
            } else {
              usedTargets.add(c.text);
              generated.push({
                type: 'text',
                prompt: `「${articleTitleClean}」の記事より、次の文の（　　　）に入る語句を答えてください。\n「${maskedSentence}」`,
                answer: c.text,
                accept: [],
                shape: describeAnswerShape(c.text),
                firstChar: getFirstChar(c.text),
                sourceText: sent
              });
            }
            break;
          }
        }
      }

      // 記述と4択を混ぜて出す（並びは種で決まるので、同じ種なら全員同じ順）
      return shuffle(generated);
    }

    // Wikipediaの本文テキスト（== 見出し == 付き）を sections に変換する
    function parseWikiExtract(text) {
      const skipHeadings = new Set(['脚注', '注釈', '出典', '参考文献', '関連項目', '外部リンク', '参照']);
      const sections = [];
      let heading = '概要';
      let buf = [];
      const flush = () => {
        const paras = buf.join('\n').split(/\n+/).map(s => s.trim()).filter(s => s.length >= 15);
        if (paras.length && !skipHeadings.has(heading)) {
          sections.push({ heading, paragraphs: paras });
        }
        buf = [];
      };
      String(text || '').split('\n').forEach(line => {
        const m = line.match(/^=+\s*(.+?)\s*=+$/);
        if (m) {
          flush();
          heading = m[1];
        } else {
          buf.push(line);
        }
      });
      flush();

      // 文字数制限で途中切れになった最後の段落を、最後の「。」までに整える
      const last = sections[sections.length - 1];
      if (last) {
        const lp = last.paragraphs[last.paragraphs.length - 1];
        if (!/[。．！？]$/.test(lp)) {
          const cut = Math.max(lp.lastIndexOf('。'), lp.lastIndexOf('．'));
          if (cut >= 0) {
            last.paragraphs[last.paragraphs.length - 1] = lp.slice(0, cut + 1);
          } else {
            last.paragraphs.pop();
            if (last.paragraphs.length === 0) sections.pop();
          }
        }
      }
      return sections;
    }

    async function fetchJsonWithTimeout(url, ms) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), ms);
      try {
        const res = await fetch(url, { signal: controller.signal });
        if (!res.ok) throw new Error('Network error');
        return await res.json();
      } finally {
        clearTimeout(timeoutId);
      }
    }

    // ランダム記事を、見出し付きの長めの本文で取得する
    async function fetchWikiLongOnce(difficulty) {
      const url = 'https://ja.wikipedia.org/w/api.php?action=query&format=json&origin=*'
        + '&generator=random&grnnamespace=0&grnlimit=1&prop=extracts&explaintext=1&exchars=1800';
      const data = await fetchJsonWithTimeout(url, 5000);
      const pages = data && data.query && data.query.pages ? Object.values(data.query.pages) : [];
      const page = pages[0];
      if (!page || !page.title || !page.extract) throw new Error('No page');
      const sections = parseWikiExtract(page.extract);
      if (sections.length === 0) throw new Error('Empty page');
      return { title: page.title, genre: 'Wikipediaランダム', difficulty, sections, src: 'long' };
    }

    // 上が失敗した時の予備：従来どおり要約だけを取得する
    async function fetchWikiSummaryOnce(difficulty) {
      const data = await fetchJsonWithTimeout('https://ja.wikipedia.org/api/rest_v1/page/random/summary', 5000);
      if (!data.title || !data.extract || data.extract.length < 120) throw new Error('Short summary');
      const parts = data.extract.split(/(?<=[。．])/).map(s => s.trim()).filter(Boolean);
      const mid = Math.max(1, Math.ceil(parts.length / 2));
      const p1 = parts.slice(0, mid).join('');
      const p2 = parts.slice(mid).join('') || p1;
      return {
        title: data.title,
        genre: 'Wikipediaランダム',
        difficulty,
        src: 'summary', // 要約だけの記事は、同じ問題を再現できないので勝負リンクの対象外
        sections: [
          { heading: '概要', paragraphs: [p1] },
          { heading: '詳細', paragraphs: [p2] }
        ]
      };
    }

    function pickFallbackArticle(excludeTitle) {
      const list = FALLBACK_ARTICLES.filter(a => a.title !== excludeTitle);
      const src = list.length > 0 ? list : FALLBACK_ARTICLES;
      return src[Math.floor(Math.random() * src.length)];
    }

    // 1回分の取得（失敗しても例外は出さず null を返す）
    async function fetchArticleCandidate(difficulty) {
      try {
        return await fetchWikiLongOnce(difficulty);
      } catch {
        try {
          return await fetchWikiSummaryOnce(difficulty);
        } catch {
          return null;
        }
      }
    }

    // モードの問題数と最低文字数を満たす記事だけを採用する。
    // 3件ずつ同時に取得し、満たす記事がなければ最大3ラウンドまで引き直す。
    async function fetchRandomWikiArticle(modeId, excludeTitle) {
      const cfg = MODES[modeId] || MODES.easy;
      const difficulty = modeId === 'easy' ? '★☆☆' : (modeId === 'hard' ? '★★★' : '★★☆');
      const need = cfg.questionCount;
      const acceptable = Math.ceil(need * 0.8);
      const minChars = cfg.minChars || 0;

      let best = null;
      let bestChars = 0;
      for (let round = 0; round < 3; round++) {
        const batch = await Promise.all([0, 1, 2].map(() => fetchArticleCandidate(difficulty)));
        for (const article of batch) {
          if (!article || article.title === excludeTitle) continue;
          const chars = countArticleChars(article);
          const n = buildQuestionsFromArticle(article, need).length;
          if (n < acceptable) continue;
          if (chars >= minChars) return article; // 条件を満たす記事が見つかった
          if (chars > bestChars) {
            best = article;
            bestChars = chars;
          }
        }
      }

      // 最低文字数には届かなかったが、一定以上の長さがある記事は使う
      if (best && bestChars >= minChars * 0.7) return best;
      return pickFallbackArticle(excludeTitle);
    }

    // ==========================================
    // 4b. Daily Mode（今日の記事）& Score Share
    // ==========================================
    // 日替わりの記事は、この一覧から日付で決まります（全員共通）。記事を足したい時はここに追加してください。
    const DAILY_TITLES = [
      '織田信長', '豊臣秀吉', '徳川家康', '坂本龍馬', '明治維新', '江戸時代', '平安時代', '縄文時代',
      '鎌倉幕府', '源氏物語', '枕草子', '万葉集', '浮世絵', '歌舞伎', '茶道', '相撲', '寿司', '日本酒',
      '味噌', '京都市', '鹿苑寺', '法隆寺', '厳島神社', '姫路城', '東京タワー', '東京スカイツリー',
      '新幹線', '青函トンネル', '富士山', '琵琶湖', '屋久島', '北海道', '沖縄県', '瀬戸内海', '黒潮',
      '夏目漱石', '芥川龍之介', '宮沢賢治', '葛飾北斎', '手塚治虫',
      '太陽', '月', '火星', '木星', '土星', '天の川銀河', 'ブラックホール', '超新星', '光合成', '細胞',
      '免疫', '恐竜', '地震', '火山', '台風', 'オーロラ', '超伝導', '半導体', '人工知能', 'インターネット',
      '活版印刷', '時計', '望遠鏡', '顕微鏡', '万有引力', '相対性理論', '量子力学', '周期表', '水素',
      '酸素', '石油', '発酵', 'サンゴ礁', '南極大陸', 'エベレスト', '太平洋', 'アマゾン川', 'サハラ砂漠',
      'ナイル川', 'ローマ帝国', '古代ギリシア', 'ルネサンス', '産業革命', 'フランス革命', '万里の長城',
      'ギザの大ピラミッド', 'ナポレオン・ボナパルト', 'ヴォルフガング・アマデウス・モーツァルト',
      'ルートヴィヒ・ヴァン・ベートーヴェン', 'レオナルド・ダ・ヴィンチ', 'フィンセント・ファン・ゴッホ',
      'ピアノ', 'ヴァイオリン', '交響曲', 'オリンピック', 'サッカー', '野球', '将棋', '囲碁', 'チェス'
    ];

    const DAILY_ARTICLE_KEY = 'sokuseki_pedia_daily_article_v1';
    const DAILY_RESULT_KEY = 'sokuseki_pedia_daily_result_v1';

    // 日本時間の日付（YYYY-MM-DD）。日替わりの切り替えは日本時間の0時
    function getTodayKey() {
      return new Date(Date.now() + 9 * 60 * 60 * 1000).toISOString().slice(0, 10);
    }

    function formatDateKey(key) {
      return String(key).replace(/-/g, '/');
    }

    function gcd(a, b) {
      return b ? gcd(b, a % b) : a;
    }

    // その日の記事候補。先頭がその日の記事、以降は取得に失敗した時の代わり
    function getDailyTitleCandidates(dateKey, howMany) {
      const [y, m, d] = dateKey.split('-').map(Number);
      const dayNum = Math.floor(Date.UTC(y, m - 1, d) / 86400000);
      const n = DAILY_TITLES.length;
      // 一覧の全記事を一巡するまで同じ記事が出ないよう、nと互いに素な歩幅で進める
      const step = [37, 31, 29, 23, 19, 17, 13, 11, 7, 5, 3, 1].find(s => gcd(s, n) === 1);
      const start = (dayNum * step) % n;
      return Array.from({ length: howMany }, (_, i) => DAILY_TITLES[(start + i) % n]);
    }

    async function fetchWikiByTitle(title, difficulty) {
      const url = 'https://ja.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1'
        + '&titles=' + encodeURIComponent(title)
        + '&prop=extracts&explaintext=1&exchars=1800';
      const data = await fetchJsonWithTimeout(url, 6000);
      const pages = data && data.query && data.query.pages ? Object.values(data.query.pages) : [];
      const page = pages[0];
      if (!page || page.missing !== undefined || !page.title || !page.extract) throw new Error('No page');
      const sections = parseWikiExtract(page.extract);
      if (sections.length === 0) throw new Error('Empty page');
      return { title: page.title, genre: 'Wikipedia', difficulty, sections, src: 'long' };
    }

    async function fetchDailyArticle(dateKey) {
      const cfg = MODES.daily;
      const genre = `今日の記事（${formatDateKey(dateKey)}）`;

      // 同じ日に何度遊んでも、同じ端末では同じ記事（編集で本文が変わっても固定）
      try {
        const raw = localStorage.getItem(DAILY_ARTICLE_KEY);
        if (raw) {
          const cached = JSON.parse(raw);
          if (cached && cached.date === dateKey && cached.article && cached.article.sections) {
            return cached.article;
          }
        }
      } catch {}

      const acceptable = Math.ceil(cfg.questionCount * 0.8);
      for (const title of getDailyTitleCandidates(dateKey, 5)) {
        try {
          const article = await fetchWikiByTitle(title, '★★☆');
          article.genre = genre;
          if (countArticleChars(article) < cfg.minChars) continue;
          const n = withSeed(dateKey, () => buildQuestionsFromArticle(article, cfg.questionCount)).length;
          if (n < acceptable) continue;
          try {
            localStorage.setItem(DAILY_ARTICLE_KEY, JSON.stringify({ date: dateKey, article }));
          } catch {}
          return article;
        } catch {
          // 次の候補へ
        }
      }

      // 通信できない時の予備（内蔵記事から日付で決める。保存はしない）
      const fb = FALLBACK_ARTICLES[hashSeed(dateKey) % FALLBACK_ARTICLES.length];
      return { ...fb, genre };
    }

    function loadDailyResult() {
      try {
        const raw = localStorage.getItem(DAILY_RESULT_KEY);
        if (!raw) return null;
        const r = JSON.parse(raw);
        return r && r.date === getTodayKey() ? r : null;
      } catch {
        return null;
      }
    }

    function saveDailyResult(dateKey, score, correct, total) {
      const prev = loadDailyResult();
      if (prev && prev.date === dateKey && prev.score >= score) return;
      try {
        localStorage.setItem(DAILY_RESULT_KEY, JSON.stringify({ date: dateKey, score, correct, total }));
      } catch {}
    }

    function dailyStatusText() {
      const res = loadDailyResult();
      const today = formatDateKey(getTodayKey());
      return res ? `${today} ・ 本日のベスト ${res.score} pt` : `${today} ・ 本日は未プレイ`;
    }

    // ---- スコアの共有 ----
    // 共有する文章はURLだけ（結果は画像で伝える）。ファイルを直接開いている時はURLなし
    function getShareUrl() {
      if (!/^https?:$/.test(location.protocol)) return '';
      return location.origin + location.pathname.replace(/index\.html$/, '');
    }

    function newSeed() {
      return Math.random().toString(36).slice(2, 8).padEnd(6, '0');
    }

    // ---- 復習：Wikipediaの記事ページへのリンク ----
    // 検索経由にしているので、タイトルがぴったり一致すれば記事へ直接飛び、なければ検索結果が開く
    function getWikipediaUrl(article) {
      const title = String((article && article.title) || '').replace(/（練習用記事）/g, '').trim();
      return 'https://ja.wikipedia.org/w/index.php?search=' + encodeURIComponent(title);
    }

    // ---- 友達対決（勝負リンク）----
    const CHALLENGE_MODES = ['easy', 'normal', 'hard'];

    // 同じ記事・同じ問題を再現できる時だけ、勝負リンクを作れる（公開ページで開いている時のみ）
    function isChallengeable() {
      return CHALLENGE_MODES.includes(state.modeId)
        && !!getShareUrl()
        && !!state.article
        && state.article.src !== 'summary'
        && !!state.seed;
    }

    function getChallengeUrl() {
      if (!isChallengeable()) return '';
      const params = new URLSearchParams({
        vs: '1',
        m: state.modeId,
        k: state.seed,
        t: state.article.title,
        s: String(state.score),
        c: String(state.answers.filter(a => a.isCorrect).length),
        n: String(state.questions.length)
      });
      return getShareUrl() + '#' + params.toString();
    }

    function parseChallengeFromHash() {
      try {
        const p = new URLSearchParams(location.hash.replace(/^#/, ''));
        if (p.get('vs') !== '1') return null;
        const modeId = p.get('m');
        const seed = p.get('k');
        const title = p.get('t');
        if (!CHALLENGE_MODES.includes(modeId)) return null;
        if (!seed || !/^[0-9a-z]{1,16}$/i.test(seed)) return null;
        if (!title || title.length > 120) return null;
        const num = (key, max) => {
          const v = p.get(key);
          if (v === null || !/^\d{1,5}$/.test(v)) return null;
          const n = parseInt(v, 10);
          return n <= max ? n : null;
        };
        return { modeId, seed, title, score: num('s', 99999), correct: num('c', 99), total: num('n', 99) };
      } catch {
        return null;
      }
    }

    async function fetchChallengeArticle(challenge) {
      const builtin = FALLBACK_ARTICLES.find(a => a.title === challenge.title);
      if (builtin) return builtin;
      const difficulty = challenge.modeId === 'easy' ? '★☆☆' : (challenge.modeId === 'hard' ? '★★★' : '★★☆');
      for (let attempt = 0; attempt < 2; attempt++) {
        try {
          const article = await fetchWikiByTitle(challenge.title, difficulty);
          article.genre = 'Wikipediaランダム';
          return article;
        } catch {
          // もう一度試す
        }
      }
      return null;
    }

    function clearChallengeHash() {
      try {
        history.replaceState(null, '', location.pathname + location.search);
      } catch {}
    }

    async function acceptChallenge() {
      const c = state.challenge;
      if (!c) return;
      clearChallengeHash();
      state.challenge = null;
      await selectMode(c.modeId, false, c);
    }

    function dismissChallenge() {
      playTap();
      clearChallengeHash();
      state.challenge = null;
      state.challengeError = false;
      render();
    }

    function buildChallengeBannerHtml() {
      const c = state.challenge;
      if (!c) return '';
      const mode = MODES[c.modeId];
      const scoreLine = c.score !== null
        ? `相手のスコア：<strong>${c.score} pt</strong>${c.correct !== null && c.total !== null ? `（正解 ${c.correct}/${c.total}）` : ''}`
        : '同じ記事・同じ問題で勝負できます';
      return `
        <div class="challenge-banner anim-pop-3">
          <div style="font-size:13px;font-weight:900;color:#141414;">⚔ 友達からの挑戦状</div>
          <div style="margin-top:6px;font-size:13.5px;line-height:1.7;color:#333333;">${escapeHtml(mode.name)}モード ／ ${scoreLine}</div>
          ${state.challengeError ? '<div style="margin-top:6px;font-size:12.5px;color:#c0392b;">記事を取得できませんでした。通信を確認して、もう一度お試しください。</div>' : ''}
          <div style="margin-top:12px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;">
            <button type="button" class="btn-primary whitespace-nowrap" style="padding:10px 18px;font-size:14px;" onclick="acceptChallenge()">この問題に挑戦する</button>
            <button type="button" class="btn-ghost-sm whitespace-nowrap" onclick="dismissChallenge()">閉じる</button>
          </div>
        </div>
      `;
    }

    // 勝負リンクから挑戦した時の、相手との比較
    function buildVersusBannerHtml() {
      const ch = state.activeChallenge;
      if (!ch || ch.score === null) return '';
      const mine = state.score;
      const theirs = ch.score;
      let headline = '🤝 引き分け！';
      if (mine > theirs) headline = '🎉 あなたの勝ち！';
      if (mine < theirs) headline = '😤 惜しい、相手の勝ち…';
      return `
        <div class="vs-banner">
          <div style="font-size:16px;font-weight:900;color:#141414;">${headline}</div>
          <div style="margin-top:4px;font-size:13px;color:#555555;">あなた ${mine} pt ／ 相手 ${theirs} pt</div>
          <div style="margin-top:4px;font-size:12px;color:#777777;">下の「勝負リンク」で、あなたのスコアを相手に送り返せます。</div>
        </div>
      `;
    }

    function buildShareCardHtml() {
      const canCopyImage = !!(navigator.clipboard && window.ClipboardItem);
      const challengeUrl = getChallengeUrl();
      const plainUrl = getShareUrl();
      const btn = 'style="padding:9px 16px;font-size:13px;"';
      let linkBtn = '';
      if (challengeUrl) {
        linkBtn = `<button type="button" class="btn-secondary whitespace-nowrap" ${btn} onclick="copyShareLink()">⚔ 勝負リンクをコピー</button>`;
      } else if (plainUrl) {
        linkBtn = `<button type="button" class="btn-secondary whitespace-nowrap" ${btn} onclick="copyShareLink()">🔗 リンクをコピー</button>`;
      }
      return `
        <div class="share-card">
          <div style="font-size:13px;font-weight:800;color:#141414;margin-bottom:10px;">📤 結果をシェア</div>
          <img id="sharePreview" class="share-preview" alt="スコア画像のプレビュー" style="display:none;" />
          <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;">
            <button type="button" class="btn-primary whitespace-nowrap" ${btn} onclick="shareResultImage()">🖼 画像で共有</button>
            <button type="button" class="btn-secondary whitespace-nowrap" ${btn} onclick="saveShareImage()">💾 画像を保存</button>
            ${canCopyImage ? `<button type="button" class="btn-secondary whitespace-nowrap" ${btn} onclick="copyShareImage()">📋 画像をコピー</button>` : ''}
            ${linkBtn}
          </div>
          ${challengeUrl ? '<div style="margin-top:10px;font-size:12px;line-height:1.6;color:#666666;">画像と一緒に送るリンクは「勝負リンク」です。開いた相手は、あなたと同じ記事・同じ問題に挑戦できます。</div>' : ''}
          <div id="shareStatus" style="margin-top:8px;min-height:18px;font-size:12px;color:#666666;"></div>
        </div>
      `;
    }

    async function copyToClipboard(text) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          return true;
        }
      } catch {}
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return ok;
      } catch {
        return false;
      }
    }

    async function copyShareLink() {
      playTap();
      const url = getChallengeUrl() || getShareUrl();
      if (!url) return;
      const ok = await copyToClipboard(url);
      setShareStatus(ok ? 'リンクをコピーしました ✓' : 'コピーできませんでした');
    }

    function setShareStatus(msg) {
      const el = document.getElementById('shareStatus');
      if (el) el.textContent = msg;
    }

    // ---- スコアの画像（Canvasで描画）----
    function roundRectPath(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function fitText(ctx, text, maxWidth) {
      if (ctx.measureText(text).width <= maxWidth) return text;
      let t = text;
      while (t.length > 1 && ctx.measureText(t + '…').width > maxWidth) t = t.slice(0, -1);
      return t + '…';
    }

    function getShareImageData() {
      const cfg = MODES[state.modeId];
      const total = state.questions.length;
      const correct = state.answers.filter(a => a.isCorrect).length;
      const isDaily = state.modeId === 'daily';
      return {
        modeLabel: isDaily ? `今日の記事 ${formatDateKey(state.dailyKey || getTodayKey())}` : cfg.name,
        // 今日の記事は全員同じ記事なので、記事名は伏せる
        articleLine: !isDaily && state.article && state.article.title ? `記事：${state.article.title}` : '',
        score: state.score,
        correct,
        total,
        rate: total > 0 ? Math.round((correct / total) * 100) : 0,
        results: state.questions.map((q, i) => {
          const a = state.answers[i];
          if (!a || a.isSkipped) return 'skip';
          return a.isCorrect ? 'ok' : 'ng';
        }),
        confs: state.questions.map((q, i) => !!(state.answers[i] && state.answers[i].confident)),
        footer: getShareUrl() || '#SkimPediA'
      };
    }

    async function drawShareImage() {
      const d = getShareImageData();
      const SIZE = 1080;
      const canvas = document.createElement('canvas');
      canvas.width = SIZE;
      canvas.height = SIZE;
      const ctx = canvas.getContext('2d');
      const DISPLAY = '"M PLUS Rounded 1c", "Noto Sans JP", sans-serif';
      const BODY = '"Noto Sans JP", sans-serif';

      // Webフォントの読み込みを待つ（使う文字だけ読み込む。待ちすぎないよう1.5秒で打ち切り）
      if (document.fonts && document.fonts.load) {
        const sample = `SkimPediA WIKIPEDIA MEMORY QUIZ 0123456789 pt 正解 不正解 スキップ 問 正答率 % ${d.modeLabel} ${d.articleLine} ${d.footer}`;
        try {
          await Promise.race([
            Promise.all([
              document.fonts.load('900 80px "M PLUS Rounded 1c"', sample),
              document.fonts.load('800 40px "Noto Sans JP"', sample),
              document.fonts.load('700 30px "Noto Sans JP"', sample)
            ]),
            new Promise(resolve => setTimeout(resolve, 1500))
          ]);
        } catch {}
      }

      // 背景とカード
      ctx.fillStyle = '#f5f5f5';
      ctx.fillRect(0, 0, SIZE, SIZE);
      roundRectPath(ctx, 60, 60, 960, 960, 56);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#e2e2e2';
      ctx.stroke();

      ctx.textBaseline = 'alphabetic';
      ctx.textAlign = 'left';

      // ロゴ
      ctx.fillStyle = '#8c8c8c';
      ctx.font = `700 24px ${BODY}`;
      if ('letterSpacing' in ctx) ctx.letterSpacing = '3px';
      ctx.fillText('WIKIPEDIA MEMORY QUIZ', 120, 140);
      if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
      ctx.fillStyle = '#141414';
      ctx.font = `900 72px ${DISPLAY}`;
      ctx.fillText('SkimPediA', 120, 222);

      // モード名のピル
      ctx.font = `800 34px ${BODY}`;
      const pillText = fitText(ctx, d.modeLabel, 700);
      const pillW = ctx.measureText(pillText).width + 56;
      roundRectPath(ctx, 120, 262, pillW, 64, 32);
      ctx.fillStyle = '#141414';
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.textBaseline = 'middle';
      ctx.fillText(pillText, 148, 295);
      ctx.textBaseline = 'alphabetic';

      // 記事名
      if (d.articleLine) {
        ctx.fillStyle = '#555555';
        ctx.font = `700 34px ${BODY}`;
        ctx.fillText(fitText(ctx, d.articleLine, 840), 120, 392);
      }

      // スコア
      const numText = String(d.score);
      ctx.font = `900 260px ${DISPLAY}`;
      const numW = ctx.measureText(numText).width;
      ctx.font = `900 90px ${DISPLAY}`;
      const ptW = ctx.measureText('pt').width;
      const scoreX = 540 - (numW + 20 + ptW) / 2;
      ctx.fillStyle = '#141414';
      ctx.font = `900 260px ${DISPLAY}`;
      ctx.fillText(numText, scoreX, 650);
      ctx.font = `900 90px ${DISPLAY}`;
      ctx.fillText('pt', scoreX + numW + 20, 650);

      // 正解数・正答率
      ctx.textAlign = 'center';
      ctx.fillStyle = '#141414';
      ctx.font = `800 44px ${BODY}`;
      ctx.fillText(`正解 ${d.correct} / ${d.total} 問　正答率 ${d.rate}%`, 540, 748);

      // 問題ごとの結果
      const COLORS = { ok: '#4fae62', ng: '#e0575b', skip: '#d4d4d4' };
      const n = d.results.length;
      if (n > 0) {
        const gap = 14;
        const size = Math.min(72, Math.floor((840 - gap * (n - 1)) / n));
        const totalW = n * size + gap * (n - 1);
        const x0 = 540 - totalW / 2;
        d.results.forEach((r, i) => {
          const bx = x0 + i * (size + gap);
          roundRectPath(ctx, bx, 800, size, size, Math.min(14, size / 4));
          ctx.fillStyle = COLORS[r];
          ctx.fill();
          if (d.confs[i]) {
            // 自信ありで答えた問題には星を入れる
            ctx.fillStyle = '#ffffff';
            ctx.font = `900 ${Math.round(size * 0.5)}px ${BODY}`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('★', bx + size / 2, 800 + size / 2 + 2);
            ctx.textBaseline = 'alphabetic';
          }
        });
      }

      // 凡例
      ctx.textAlign = 'left';
      ctx.font = `700 24px ${BODY}`;
      const legend = [['ok', '正解'], ['ng', '不正解'], ['skip', 'スキップ']];
      if (d.confs.some(Boolean)) legend.push(['conf', '自信あり']);
      const boxS = 22, boxGap = 10, itemGap = 36;
      const widths = legend.map(([, label]) => boxS + boxGap + ctx.measureText(label).width);
      let lx = 540 - (widths.reduce((a, b) => a + b, 0) + itemGap * (legend.length - 1)) / 2;
      legend.forEach(([key, label], i) => {
        roundRectPath(ctx, lx, 912, boxS, boxS, 6);
        ctx.fillStyle = key === 'conf' ? '#8c8c8c' : COLORS[key];
        ctx.fill();
        if (key === 'conf') {
          ctx.fillStyle = '#ffffff';
          ctx.font = `900 16px ${BODY}`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('★', lx + boxS / 2, 912 + boxS / 2 + 1);
          ctx.textBaseline = 'alphabetic';
          ctx.textAlign = 'left';
          ctx.font = `700 24px ${BODY}`;
        }
        ctx.fillStyle = '#666666';
        ctx.fillText(label, lx + boxS + boxGap, 930);
        lx += widths[i] + itemGap;
      });

      // フッター
      ctx.textAlign = 'center';
      ctx.fillStyle = '#8c8c8c';
      ctx.font = `500 26px ${BODY}`;
      ctx.fillText(fitText(ctx, d.footer, 840), 540, 988);

      return new Promise(resolve => canvas.toBlob(b => resolve(b), 'image/png'));
    }

    let sharePreviewUrl = null;
    async function updateSharePreview() {
      state.shareBlob = null;

    async function copyShareImage() {

    // 画像つきで共有。共有メニューが使えない環境では、画像を保存する
    async function shareResultImage() {

      try {
        blob = await getShareImageBlob();
      } catch {}

        setShareStatus('画像を作れませんでした');
        return;
      }
      const file = new File([blob], 'skimpedia-score.png', { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {

    // ==========================================
    // 4c. 自信度ベット / ハードモード（流れる記事）
    // ==========================================
    // 配点：なんとなく＝正解100（ヒント使用時は50）・外れ0 ／ 自信あり＝正解200・外れ−100（合計は0未満にならない）
    function calcPoints(isCorrect, confident, hintUsed) {
      if (confident) return isCorrect ? 200 : -100;
      return isCorrect ? (hintUsed ? 50 : 100) : 0;
    }

    function formatPoints(n) {
      if (n < 0) return `−${Math.abs(n)}`;
      return n > 0 ? `+${n}` : '0';
    }

    function pointsPillText() {
      if (state.confident) return '🔥 自信あり：正解 +200 pt ／ 外れ −100 pt';
      return state.hintUsedForCurrent ? '配点：50 pt（ヒント使用中）' : '配点：100 pt';
    }

    // 画面全体を描き直さず、ボタンの見た目だけ更新する
    function updateBetDOM() {
      const normalBtn = document.getElementById('betNormalBtn');
      const hotBtn = document.getElementById('betHotBtn');
      const hintBtn = document.getElementById('hintBtn');
      const pill = document.getElementById('pointsPill');
      if (normalBtn) normalBtn.classList.toggle('active', !state.confident);
      if (hotBtn) {
        hotBtn.classList.toggle('active', state.confident);
        hotBtn.disabled = state.hintUsedForCurrent;
      }
      if (hintBtn) hintBtn.disabled = state.hintUsedForCurrent || state.confident;
      if (pill) pill.textContent = pointsPillText();
    }

    function setConfidence(on) {
      if (state.screen !== 'quiz') return;
      // ヒントを使った問題では自信ありにできない
      state.confident = !!on && !state.hintUsedForCurrent;
      playTap();
      updateBetDOM();
    }

    function buildBetRowHtml() {
      return `
        <div class="bet-row select-none">
          <span class="bet-label whitespace-nowrap">自信度：</span>
          <button type="button" id="betNormalBtn" class="bet-btn ${state.confident ? '' : 'active'}" onclick="setConfidence(false)">
            🤔 なんとなく
            <small>正解 +100 ／ 外れ 0</small>
          </button>
          <button type="button" id="betHotBtn" class="bet-btn hot ${state.confident ? 'active' : ''}" ${state.hintUsedForCurrent ? 'disabled' : ''} onclick="setConfidence(true)">
            🔥 自信あり
            <small>正解 +200 ／ 外れ −100</small>
          </button>
        </div>
      `;
    }

    // ---- ハードモード：記事が時間とともに消えていく ----
    const FLOW_GRACE_SEC = 12; // 最初の文が消え始めるまでの猶予

    function getFlowPlan(article) {
      const chars = countArticleChars(article);
      // 全文が消えきるまでの秒数（文字数に応じて45〜100秒）
      const total = Math.min(100, Math.max(45, Math.round(chars / 18)));
      return { grace: FLOW_GRACE_SEC, total };
    }

    function splitForFlow(paragraph) {
      return String(paragraph || '').split(/(?<=[。．！？])/).filter(s => s.length > 0);
    }

    function buildFlowArticleHtml(art) {
      let idx = 0;
      return art.sections.map(sec => `
        <h3>${escapeHtml(sec.heading)}</h3>
        ${(sec.paragraphs || []).map(p => `<p>${splitForFlow(p).map(s => `<span class="flow-sent" data-i="${idx++}">${escapeHtml(s)}</span>`).join('')}</p>`).join('')}
      `).join('');
    }

    let flowTickerId = null;

    function stopFlowTicker() {
      if (flowTickerId) {
        clearInterval(flowTickerId);
        flowTickerId = null;
      }
    }

    // 経過時間から、各文を「消えかけ」「消えた」にする（画面を描き直しても経過時間は引き継がれる）
    function tickFlow() {
      if (state.screen !== 'memorize' || !MODES[state.modeId] || !MODES[state.modeId].flow) {
        stopFlowTicker();
        return;
      }
      const els = document.querySelectorAll('#articleBody .flow-sent');
      if (els.length === 0) return;
      const plan = getFlowPlan(state.article);
      const elapsed = (Date.now() - state.flowStartMs) / 1000;
      const total = els.length;
      let goneCount = 0;
      els.forEach((el, i) => {
        const vanishAt = plan.grace + ((i + 1) / total) * plan.total;
        const gone = elapsed >= vanishAt;
        if (gone) goneCount += 1;
        el.classList.toggle('gone', gone);
        el.classList.toggle('fading', !gone && elapsed >= vanishAt - 2);
        // 消え終わったら詰める（読んでいる位置が下に押し下げられないように）
        el.classList.toggle('collapsed', elapsed >= vanishAt + 1.5);
      });
      document.querySelectorAll('#articleBody p').forEach(p => {
        p.classList.toggle('all-gone', !p.querySelector('.flow-sent:not(.collapsed)'));
      });
      const remainRate = Math.round((1 - goneCount / total) * 100);
      const fill = document.getElementById('flowBarFill');
      if (fill) fill.style.width = `${remainRate}%`;
      const label = document.getElementById('flowLabel');
      if (label) label.textContent = `${remainRate}%`;
    }

    function startFlowTicker() {
      stopFlowTicker();
      tickFlow();
      flowTickerId = setInterval(tickFlow, 250);
    }

    // ==========================================
    // 5. Game Flow Actions
    // ==========================================
    function goToStart() {
      playTap();
      stopTimer();
      state.loadToken += 1;
      state.screen = 'start';
      state.scores = loadScores();

    async function selectMode(modeId, isReroll = false, challenge = null) {
      if (isReroll) {
        // 今日の記事と、勝負リンクの挑戦中は引き直し不可（全員・相手と同じ記事のため）
        if (state.rerollUsed || state.modeId === 'daily' || state.activeChallenge) return;
        playPageFlip();
        state.rerollUsed = true;
      } else {
        playTap();
        state.modeId = modeId;
        state.rerollUsed = false;
        state.memoText = '';
        state.memoOpen = false;
        state.timeLeftSec = MODES[modeId].timeLimitSec;
        state.activeChallenge = challenge;
        state.challengeError = false;
      }
      state.seed = challenge ? challenge.seed : newSeed();

      const myToken = ++state.loadToken;
      state.screen = 'loading';
      render();

      let article;
      if (state.modeId === 'tutorial' && !isReroll) {
        article = TUTORIAL_ARTICLE;
      } else if (state.modeId === 'daily') {
        state.dailyKey = getTodayKey();
        article = await fetchDailyArticle(state.dailyKey);
      } else if (challenge) {
        article = await fetchChallengeArticle(challenge);
        if (myToken !== state.loadToken) return;
        if (!article) {
          // 記事を取れなかったら、挑戦状を残してタイトルへ戻す
          state.activeChallenge = null;
          state.challenge = challenge;
          state.challengeError = true;
          state.screen = 'start';
          render();
          return;
        }
      } else {
        article = await fetchRandomWikiArticle(state.modeId, state.article && state.article.title);
      }
      // 取得中にタイトル等へ戻った場合は、遅れて届いた記事を使わない
      if (myToken !== state.loadToken) return;
      state.article = article;
      state.flowStartMs = Date.now();

      state.screen = 'memorize';
      render();
      startTimer();
    }

    function toggleMemoDrawer() {
      playTap();
      state.memoOpen = !state.memoOpen;

    function setMarkerColor(color) {
